<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任务大大 Logo 预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans SC', sans-serif;
    background: #f5f5f5; color: #111; padding: 48px 24px;
  }
  h1 { text-align: center; font-size: 24px; margin-bottom: 8px; }
  .sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 48px; }
  .grid { display: flex; gap: 24px; max-width: 1100px; margin: 0 auto; flex-wrap: wrap; justify-content: center; }
  .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 36px 28px; flex: 1 1 320px; max-width: 360px; }
  .card h2 { font-size: 16px; margin-bottom: 2px; }
  .card .desc { font-size: 12px; color: #aaa; margin-bottom: 28px; }
  .row { margin-bottom: 24px; }
  .row label { display: block; font-size: 10px; color: #bbb; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .row .box {
    border: 1px solid #eee; border-radius: 8px; padding: 16px;
    display: flex; align-items: center; justify-content: center;
    min-height: 72px; background: #fafafa;
  }
  .row .box img { max-width: 100%; height: auto; }
</style>
</head>
<body>
<h1>任务大大 · TaskDada</h1>
<p class="sub">黑白极简 Logo 方案</p>
<div class="grid">
  <div class="card">
    <h2>方案一：方形勾选</h2>
    <p class="desc">圆角方框 + 粗勾选，最直接的任务隐喻</p>
    <div class="row"><label>横向</label><div class="box"><img src="concept-1/horizontal.svg" width="300"></div></div>
    <div class="row"><label>纵向</label><div class="box"><img src="concept-1/vertical.svg" width="120"></div></div>
    <div class="row"><label>纯图标</label><div class="box"><img src="concept-1/icon.svg" width="80"></div></div>
  </div>
  <div class="card">
    <h2>方案二：双竖线</h2>
    <p class="desc">实心 + 空心竖条，进度条与任务追踪</p>
    <div class="row"><label>横向</label><div class="box"><img src="concept-2/horizontal.svg" width="300"></div></div>
    <div class="row"><label>纵向</label><div class="box"><img src="concept-2/vertical.svg" width="120"></div></div>
    <div class="row"><label>纯图标</label><div class="box"><img src="concept-2/icon.svg" width="80"></div></div>
  </div>
  <div class="card">
    <h2>方案三：圆形 TD</h2>
    <p class="desc">圆环 + TD 字母，简洁有力的字母标志</p>
    <div class="row"><label>横向</label><div class="box"><img src="concept-3/horizontal.svg" width="300"></div></div>
    <div class="row"><label>纵向</label><div class="box"><img src="concept-3/vertical.svg" width="120"></div></div>
    <div class="row"><label>纯图标</label><div class="box"><img src="concept-3/icon.svg" width="80"></div></div>
  </div>
</div>
</body>
</html>
